services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  # Одноразовый контейнер: скачивает модели при первом запуске и завершается
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:3b} && ollama pull ${EMBED_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy

  bot:
    build: .
    env_file: .env
    volumes:
      - ./data/docs:/app/data/docs
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
