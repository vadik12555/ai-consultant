name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Тесты + миграции на Postgres/pgvector
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 3s
          --health-retries 20
    env:
      TELEGRAM_BOT_TOKEN: "000:test"  # тестам настоящий токен не нужен
      MANAGER_CHAT_ID: "1"
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Миграции применяются и откатываются
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest -v

  docker:
    name: Docker-образ собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-consultant .
